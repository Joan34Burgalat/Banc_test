
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BANC_TEST - MES</title>

    <link rel="stylesheet" href="/static/mes/mes.css">

    <!-- Bibliothèque graphique -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Notre code JavaScript -->
    <script src="/static/mes/mes.js" defer></script>
</head>

<body>

    <header>
        <h1>BANC_TEST - MES</h1>
        <p>Oscilloscope virtuel</p>
    </header>

    <main>
        <section class="controls">

            <label for="channel">Canal :</label>
            <select id="channel">
                <option value="1">CH1</option>
                <option value="2">CH2</option>
                <option value="3">CH3</option>
                <option value="4">CH4</option>
            </select>

            <label for="fftWindow">Fenêtre FFT :</label>
            <select id="fftWindow">
                <option value="rectangular">Rectangulaire</option>
                <option value="hann">Hann</option>
            </select>
            
            <label for="fftSize">Taille FFT :</label>
            <select id="fftSize">
                <option value="1000">1 000 échantillons — 100 Hz</option>
                <option value="2000">2 000 échantillons — 50 Hz</option>
                <option value="5000">5 000 échantillons — 20 Hz</option>
                <option value="10000">10 000 échantillons — 10 Hz</option>
            </select>

            <button id="connect">Connecter</button>
            <button id="disconnect" disabled>Déconnecter</button>

            <p id="status">Déconnecté</p>
            <p id="samples">Échantillons reçus : 0</p>
            
        </section>

        <section class="oscilloscope">
            <h2>Oscilloscope</h2>
            <canvas id="signalChart"></canvas>
        </section>

        <section class="oscilloscope">
            <h2>Analyseur spectral - FFT</h2>
            <canvas id="fftChart"></canvas>
        </section>

        <section class="measurements">
            <h2>Mesures automatiques</h2>
            <p>Vmax : <span id="vmax">--</span> V</p>
            <p>Vmin : <span id="vmin">--</span> V</p>
            <p>Moyenne : <span id="vmean">--</span> V</p>
            <p>Vpp : <span id="vpp">--</span> V</p>
            <p>RMS : <span id="vrms">--</span> V</p>
        </section>

    </main>

</body>
</html>
