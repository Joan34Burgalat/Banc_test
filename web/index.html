<!-- 
Création de la page web de l'IHM et des éléments qui constituent cette IHM
 -->


<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BANC_TEST - Générateur</title>  <!--Nom de l'onglet dans le navigateur -->

    <link rel="stylesheet" href="style.css"> <!--se référer au fichier css pour le style -->
</head>


<!-- 
Création de la mise en page de l'IHM et des éléments qui constituent cette IHM
 -->
<body>

    <header> <!-- Bandeau en haut de la page -->
        <h1>BANC_TEST</h1>
        <p>Générateur de signaux - 4 canaux</p>
    </header>

    <main>

        <section class="generator">

            <h2>Configuration des canaux</h2>  <!--Niveau 2 du titre -->

            <label for="Canaux">Canaux :</label>  <!--Création du label canaux -->

            <select id="Canaux">                         <!--Création de la l'objet HTML repéré avec l'id canaux -->
                <option value="1">Canal 1</option>         <!-- Canal 1-->
                <option value="2">Canal 2</option>         <!-- Canal 2 -->
                <option value="3">Canal 3</option>         <!-- Canal 3 -->
                <option value="4">Canal 4</option>         <!-- Canal 4 -->
            </select>                                   

            <label for="Forme_du_signal">Forme du signal :</label>   <!--Création du label forme du signal -->

            <select id="Forme_du_signal">                                <!--Création de la l'objet HTML repéré avec l'id Forme_du_signal -->
                <option value="sine">Sinus</option>              <!-- Forme sinusoïdale -->
                <option value="square">Carré</option>            <!-- Forme carré -->
                <option value="triangle">Triangle</option>       <!-- Forme triangulaire -->
                <option value="dc">Continu</option>              <!-- Forme continue -->
            </select>

            <label for="frequency">Fréquence (Hz) :</label>  <!--Création du label Fréquence -->
            <input type="number"                    
                   id="frequence"
                   value="1000"
                   min="0">    <!--Création de la l'objet HTML repéré avec l'id frequence -->

            <label for="amplitude">Amplitude (V) :</label>  <!--Création du label Amplitude -->
            <input type="number"
                   id="amplitude"
                   value="5"
                   min="0"
                   step="0.1">    <!--Création de la l'objet HTML repéré avec l'id amplitude -->
            
            <label for="offset">Decallage (V) :</label>                 <!--Création du label Decallage -->
            <input type="number" id="decallage" value="0" step="0.1">

            <label for="phase">Phase (°) :</label>                   <!--Création du label Phase -->
            <input type="number" id="phase" value="0" step="1">

            <label for="enabled">Sortie activée :</label>            <!--Création du label Sortie activée  -->
            <input type="checkbox" id="enabled">

            <button id="apply">Appliquer</button>

            <p id="status">En attente de configuration...</p>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
