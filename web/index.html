
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BANC_TEST - Générateur</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>BANC_TEST</h1>
        <p>Générateur de signaux - 4 canaux</p>
    </header>

    <main>

        <section class="generator">

            <h2>Configuration des canaux</h2>

            <label for="channel">Canal :</label>

            <select id="channel">
                <option value="1">CH1</option>
                <option value="2">CH2</option>
                <option value="3">CH3</option>
                <option value="4">CH4</option>
            </select>

            <label for="waveform">Signal :</label>

            <select id="waveform">
                <option value="sine">Sinus</option>
                <option value="square">Carré</option>
                <option value="triangle">Triangle</option>
                <option value="dc">Continu</option>
            </select>

            <label for="frequency">Fréquence (Hz) :</label>
            <input type="number"
                   id="frequency"
                   value="1000"
                   min="0">

            <label for="amplitude">Amplitude (V) :</label>
            <input type="number"
                   id="amplitude"
                   value="5"
                   min="0"
                   step="0.1">

            <button id="apply">Appliquer</button>

            <p id="status">En attente de configuration...</p>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
